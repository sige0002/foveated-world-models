# lightning.pytorch==2.6.6
seed_everything: 42
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: bf16-mixed
  logger:
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: /media/sadasue/SSD1/foveated-world-models/runs/robotwin-official-fresh-b64-30k
      name: metrics
      version: null
      prefix: ''
      flush_logs_every_n_steps: 100
  callbacks:
  - class_path: research.check_stage1_runtime.RuntimeContract
  - class_path: research.stage1_checkpoint_events.CheckpointEvaluation
    init_args:
      every: 1000
  - class_path: latent_action_model.core.lam_lightinng.SaveConfigToCheckpointCallback
    init_args:
      config_path: ''
      filename: ''
  fast_dev_run: false
  max_epochs: -1
  min_epochs: null
  max_steps: 30000
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: 50.0
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: 1000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  log_every_n_steps: 10
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: /media/sadasue/SSD1/foveated-world-models/runs/robotwin-official-fresh-b64-30k
  enable_autolog_hparams: true
  model_registry: null
model:
  dim: 1024
  num_heads: 16
  ffn_expansion_factor: 4
  enc_layers: 24
  codebook_size: 32
  code_dim: 32
  max_state_dim: 32
  num_frames: 2
  num_queries: 1
  vq_kwargs:
    layer_norm: true
  dec_layers: 12
  dropout: 0.0
  lambda_aux: 1.0
  loss_type: smooth_l1
  state_loss_type: l2
  project: lam
  task_name: robotwin_official_fresh_b64_30k
  wandb_offline: true
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 0.0003
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
      weight_decay: 0.01
      amsgrad: false
      maximize: false
      foreach: null
      capturable: false
      differentiable: false
      fused: null
  weight_decay: 0.01
  exclude_bias_norm_from_wd: true
  make_data_pair: false
  output_dir: output_pairs
  vision_model_id: /media/sadasue/SSD1/foveated-world-models/models/dinov3-vitb16-pretrain-lvd1689m
  warmup_steps: 10000
  lambda_diversity: 0.0
  norm_latents: true
  norm_latents_type: ln
  disable_vq: false
  vq_type: vae
  enc_add_state: false
  enc_modal_mask: true
  latent_layer_to_use: -2
  multi_input: false
  num_embodiments: 32
  image_hw:
  - 256
  - 256
  patch_size: 16
  image_aug: true
  dual_view_aug: true
  decoder_last_ln: true
data:
  data_root_dir: /media/sadasue/SSD1/foveated-world-models/research/official-data-contract-audit-20261113/robotwin-qfix-data
  data_mix: robotwin_merged
  num_frames: 2
  video_backend: pyav
  preferred_video_key: null
  state_keys: null
  frame_dt_sec: 1.6
  human_frame_dt_sec: 0.4
  batch_size: 64
  num_workers: 4
  prefetch_factor: 4
  in_order: false
  pin_memory: true
  persistent_workers: false
  debug_repeat_batch: false
  val_tail_ratio: 0.001
  max_state_dim: 32
optimizer: null
lr_scheduler: null
ckpt_path: null
weights_only: null
