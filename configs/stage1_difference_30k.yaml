seed_everything: 42
model:
  vision_model_id: /media/sadasue/SSD1/foveated-world-models/models/dinov3-vitb16-pretrain-lvd1689m
  dim: 1024
  enc_layers: 24
  ffn_expansion_factor: 4
  num_heads: 16
  max_state_dim: 32
  num_embodiments: 32
  codebook_size: 32
  code_dim: 32
  num_queries: 1
  num_frames: 2
  image_hw:
  - 256
  - 256
  patch_size: 16
  image_aug: true
  dual_view_aug: true
  dec_layers: 12
  dropout: 0.0
  warmup_steps: 10000
  enc_add_state: false
  enc_modal_mask: true
  lambda_aux: 1.0
  loss_type: smooth_l1
  state_loss_type: l2
  latent_layer_to_use: -2
  multi_input: false
  norm_latents: true
  norm_latents_type: ln
  lambda_diversity: 0.0
  vq_type: vae
  vq_kwargs:
    layer_norm: true
  project: lam
  task_name: stage1_difference_30k
  wandb_offline: true
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 3e-4
      weight_decay: 1e-2
  exclude_bias_norm_from_wd: true
  make_data_pair: false
  output_dir: output_pairs
data:
  data_root_dir: /media/sadasue/SSD1/foveated-world-models/research/official-data-contract-audit-20261113/robotwin-qfix-data
  data_mix: robotwin_merged
  video_backend: pyav
  num_frames: 2
  image_hw:
  - 256
  - 256
  frame_dt_sec: 1.6
  human_frame_dt_sec: 0.4
  batch_size: 64
  num_workers: 4
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: false
  in_order: false
  debug_repeat_batch: false
  max_state_dim: 32
trainer:
  max_epochs: -1
  accelerator: gpu
  devices: 1
  strategy: auto
  accumulate_grad_batches: 1
  precision: bf16-mixed
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  val_check_interval: 1000
  num_sanity_val_steps: 0
  limit_val_batches: 50
  callbacks:
  - class_path: research.difference_progress.DifferenceProgress
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: /media/sadasue/SSD1/foveated-world-models/runs/stage1-difference-30k-20261124/checkpoints
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      save_on_train_epoch_end: false
      filename: step{step:06d}
      auto_insert_metric_name: false
  logger:
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: /media/sadasue/SSD1/foveated-world-models/runs/stage1-difference-30k-20261124
      name: metrics
  max_steps: 30000
  default_root_dir: /media/sadasue/SSD1/foveated-world-models/runs/stage1-difference-30k-20261124
  check_val_every_n_epoch: null
  enable_progress_bar: false
