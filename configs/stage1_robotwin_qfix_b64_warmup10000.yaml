# Same RLinf Stage-1 optimizer and linear warmup implementation as pinned upstream.
# Planned first experiment: 10k warmup + 20k updates at the peak learning rate.
official_source: /media/sadasue/SSD1/foveated-world-models/research/official-data-contract-audit-20261113/LaWAM-robotwin-delta2
official_commit: c12168d9077edea67fe7c1b70d08b80b8e65a9c8
official_config: latent_action_model/config/dino_large_vae.yaml
dependency_roots:
  - /media/sadasue/SSD1/foveated-world-models/research/official-data-contract-audit-20261113/python-deps
  - /media/sadasue/SSD1/foveated-world-models/research/official-data-contract-audit-20261113/pytorch3d
hf_home: /media/sadasue/SSD1/foveated-world-models/research/official-data-contract-audit-20261113/hf-cache
seed: 42
cpu_threads: 4
split:
  validation_fraction: 0.05
  seed: 42
model:
  vision_model_id: /media/sadasue/SSD1/foveated-world-models/models/dinov3-vitb16-pretrain-lvd1689m
  state_output_scale: 2.0
  warmup_steps: 10000
  task_name: robotwin_qfix_delta2_b64_warmup10000
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 3e-4
      weight_decay: 1e-2
data:
  data_root_dir: /media/sadasue/SSD1/foveated-world-models/research/official-data-contract-audit-20261113/robotwin-qfix-data
  data_mix: robotwin_merged
  batch_size: 64
  num_workers: 4
  prefetch_factor: 2
trainer:
  max_steps: 30000
  max_epochs: -1
  accelerator: gpu
  devices: 1
  strategy: auto
  accumulate_grad_batches: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  val_check_interval: 5000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  # Keep the same first 512 validation pairs: 8 batches x 64.
  limit_val_batches: 8
  log_every_n_steps: 20
  enable_progress_bar: false
  enable_model_summary: false
