diagnostic:
  protocol: robotwin_g_onset_20261114
  arm: g_off
  factors:
    image_loss: l2
    kl_beta: 1.0e-05
    lambda_aux: 0.0
    posterior_sampling: sampled
    initialization: fresh
  validation_samples: 512
  scope: Prepared500-update diagnostic; no main training or automatic follow-on launch.
  motivations_and_limits:
  - Initial measured g-to-encoder gradients dominate the early image gradients; local
    g output is2*tanh following the earlier delta-range patch.
  - Official architecture also uses AdaLN zero initialization; initial g dominance
    alone does not explain the difference from official performance.
  - The dataset contains many tasks and non-unidirectional state changes; data monotony
    is not established.
  - Only lambda_aux differs between the paired runs. No official-init arm added.
  - This is a causal diagnostic of early g-loss contribution, not a claim that g or
    grippers caused the observed concentration.
  - Stop at500 updates. Fixed onset probes at0,10,50,100,250 use64 pairs; final500
    uses512 and also records first64 geometry.
